<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HIGHWAY CAFE - Admin</title>


    <!-- =================================================
         SUPABASE
    ================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            background: #f5eee6;

            font-family: Arial, sans-serif;

            color: #4b2e1f;
        }


        h1 {

            text-align: center;

            margin-bottom: 5px;

            font-size: 36px;
        }


        .subtitle {

            text-align: center;

            color: #6b5143;

            margin-bottom: 25px;
        }


        .container {

            max-width: 1100px;

            margin: auto;
        }


        .card {

            background: white;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 20px;

            box-shadow:
                0 3px 10px rgba(0, 0, 0, 0.08);
        }


        .card h2 {

            margin-top: 0;

            border-bottom: 2px solid #eee;

            padding-bottom: 10px;
        }


        /* =================================================
           SHOP STATUS
        ================================================== */

        .shop-status {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            flex-wrap: wrap;
        }


        .status {

            font-size: 24px;

            font-weight: bold;
        }


        .open {

            color: green;
        }


        .closed {

            color: red;
        }


        /* =================================================
           BUTTONS
        ================================================== */

        button {

            border: none;

            border-radius: 8px;

            padding: 10px 18px;

            font-size: 15px;

            cursor: pointer;

            background: #4b2e1f;

            color: white;
        }


        button:hover {

            opacity: 0.85;
        }


        .danger {

            background: #b22222;
        }


        .success {

            background: #228b22;
        }


        /* =================================================
           MENU
        ================================================== */

        .category {

            margin-top: 25px;
        }


        .category:first-child {

            margin-top: 0;
        }


        .category h3 {

            margin-bottom: 10px;

            color: #6b5143;

            font-size: 20px;
        }


        .menu-item {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px;

            border-bottom: 1px solid #eee;

            gap: 15px;
        }


        .menu-item:last-child {

            border-bottom: none;
        }


        .item-name {

            font-weight: bold;

            font-size: 16px;
        }


        .item-category {

            font-size: 13px;

            color: #888;

            margin-top: 4px;
        }


        /* =================================================
           ORDERS
        ================================================== */

        .order {

            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 15px;

            margin-bottom: 15px;

            background: #fafafa;
        }


        .new-order {

            border-left: 6px solid #228b22;
        }


        .order-header {

            display: flex;

            justify-content: space-between;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 10px;
        }


        .order-number {

            font-size: 20px;

            font-weight: bold;
        }


        .order-status {

            font-weight: bold;
        }


        .order-details {

            line-height: 1.6;

            white-space: pre-wrap;

            margin-bottom: 15px;
        }


        .order-total {

            font-size: 20px;

            font-weight: bold;

            margin-top: 10px;

            padding-top: 10px;

            border-top: 1px solid #ddd;
        }


        .status-buttons {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            margin-top: 15px;
        }


        .status-button {

            background: #777;
        }


        .status-button.selected {

            background: #4b2e1f;
        }


        .empty {

            text-align: center;

            padding: 25px;

            color: #777;
        }


        .refresh-button {

            margin-bottom: 15px;
        }


        .loading {

            text-align: center;

            padding: 20px;

            color: #777;
        }


        .error-message {

            text-align: center;

            padding: 20px;

            color: #b22222;

            font-weight: bold;
        }


        /* =================================================
           MOBILE
        ================================================== */

        @media (max-width: 600px) {

            body {

                padding: 10px;
            }


            h1 {

                font-size: 28px;
            }


            .shop-status {

                flex-direction: column;

                align-items: stretch;
            }


            .shop-status button {

                width: 100%;
            }


            .menu-item {

                align-items: flex-start;

                flex-direction: column;
            }


            .menu-item button {

                width: 100%;
            }


            .status-buttons button {

                flex: 1;

                min-width: 120px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =================================================
         HEADER
    ================================================== -->

    <h1>
        HIGHWAY CAFE
    </h1>


    <div class="subtitle">
        ADMIN DASHBOARD
    </div>


    <!-- =================================================
         SHOP STATUS
    ================================================== -->

    <div class="card">

        <h2>
            🏪 Shop Status
        </h2>


        <div class="shop-status">


            <div id="shopStatus"
                 class="status">

                Loading...

            </div>


            <button
                id="shopToggleButton"
                onclick="toggleShop()">

                Loading...

            </button>


        </div>

    </div>


    <!-- =================================================
         MENU AVAILABILITY
    ================================================== -->

    <div class="card">

        <h2>
            ☕ Menu Availability
        </h2>


        <div id="menuContainer">

            <div class="loading">
                Loading menu...
            </div>

        </div>

    </div>


    <!-- =================================================
         ORDERS
    ================================================== -->

    <div class="card">

        <h2>
            📦 Orders
        </h2>


        <button
            class="refresh-button"
            onclick="loadOrders()">

            🔄 Refresh Orders

        </button>


        <div id="ordersContainer">

            <div class="loading">
                Loading orders...
            </div>

        </div>

    </div>


</div>


<script>


/* =====================================================
   SUPABASE CONNECTION
===================================================== */


/*
    KEEP THESE VALUES.

    SUPABASE_URL:
    Your Supabase project URL.

    SUPABASE_KEY:
    Your Supabase PUBLISHABLE KEY.

    DO NOT use a secret/service-role key here.
*/


const SUPABASE_URL =
    "https://qfnjegsbyxxqsdaelqqa.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_ttu1AyOaylp3J4x7iTqaNg_1VLOdHoE";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   CHECK SUPABASE CONNECTION
===================================================== */

console.log(
    "HIGHWAY CAFE ADMIN CONNECTED"
);


/* =====================================================
   SHOP STATUS
===================================================== */


/*
    Load the current shop status.

    IMPORTANT:
    We only request shop_open.

    We do NOT request the id.

    This prevents the old
    id=eq.undefined problem.
*/


async function loadShopStatus() {


    const { data, error } =

        await supabaseClient

            .from("shop_settings")

            .select("shop_open")

            .limit(1);


    if (error) {


        console.error(
            "Shop status loading error:",
            error
        );


        document.getElementById(
            "shopStatus"
        ).textContent =
            "Error loading shop status";


        document.getElementById(
            "shopToggleButton"
        ).textContent =
            "Try Again";


        return;
    }


    if (
        !data ||
        data.length === 0
    ) {


        console.error(
            "No shop_settings row found."
        );


        document.getElementById(
            "shopStatus"
        ).textContent =
            "No shop settings found";


        document.getElementById(
            "shopToggleButton"
        ).textContent =
            "Create Shop Status";


        return;
    }


    const currentStatus =
        data[0].shop_open;


    updateShopDisplay(
        currentStatus
    );

}


/* =====================================================
   DISPLAY SHOP STATUS
===================================================== */


function updateShopDisplay(
    isOpen
) {


    const status =
        document.getElementById(
            "shopStatus"
        );


    const button =
        document.getElementById(
            "shopToggleButton"
        );


    if (isOpen) {


        status.textContent =
            "🟢 SHOP IS OPEN";


        status.className =
            "status open";


        button.textContent =
            "🔴 Close Shop";


        button.className =
            "danger";


    }

    else {


        status.textContent =
            "🔴 SHOP IS CLOSED";


        status.className =
            "status closed";


        button.textContent =
            "🟢 Open Shop";


        button.className =
            "success";

    }

}


/* =====================================================
   TOGGLE SHOP
===================================================== */


async function toggleShop() {


    console.log(
        "Toggle shop clicked."
    );


    /* ---------------------------------------------
       GET CURRENT STATUS
    --------------------------------------------- */


    const { data, error } =

        await supabaseClient

            .from("shop_settings")

            .select("shop_open")

            .limit(1);


    if (error) {


        console.error(
            "Could not read shop status:",
            error
        );


        alert(
            "Could not read shop status."
        );


        return;
    }


    if (
        !data ||
        data.length === 0
    ) {


        alert(
            "No shop settings were found."
        );


        return;
    }


    /* ---------------------------------------------
       CURRENT STATUS
    --------------------------------------------- */


    const currentStatus =
        data[0].shop_open;


    const newStatus =
        !currentStatus;


    console.log(
        "Current shop status:",
        currentStatus
    );


    console.log(
        "New shop status:",
        newStatus
    );


    /* ---------------------------------------------
       UPDATE WITHOUT USING ID
    --------------------------------------------- */


    const { error: updateError } =

        await supabaseClient

            .from("shop_settings")

            .update({

                shop_open:
                    newStatus,

                updated_at:
                    new Date().toISOString()

            })

            .eq(
                "shop_open",
                currentStatus
            );


    if (updateError) {


        console.error(
            "Shop update error:",
            updateError
        );


        alert(
            "Could not update shop status."
        );


        return;
    }


    console.log(
        "Shop status successfully updated."
    );


    /* ---------------------------------------------
       UPDATE SCREEN
    --------------------------------------------- */


    updateShopDisplay(
        newStatus
    );

}


/* =====================================================
   LOAD MENU
===================================================== */


async function loadMenu() {


    const container =
        document.getElementById(
            "menuContainer"
        );


    container.innerHTML =
        `<div class="loading">
            Loading menu...
        </div>`;


    const { data, error } =

        await supabaseClient

            .from("menu_items")

            .select("*")

            .order("category")

            .order("product_name");


    if (error) {


        console.error(
            "Menu loading error:",
            error
        );


        container.innerHTML =
            `<div class="error-message">
                Could not load menu.
            </div>`;


        return;
    }


    if (
        !data ||
        data.length === 0
    ) {


        container.innerHTML =
            `<div class="empty">
                No menu items found.
            </div>`;


        return;
    }


    /* ---------------------------------------------
       GROUP MENU BY CATEGORY
    --------------------------------------------- */


    const categories = {};


    data.forEach(
        function(item) {


            if (
                !categories[item.category]
            ) {


                categories[item.category] =
                    [];

            }


            categories[item.category]
                .push(item);


        }
    );


    /* ---------------------------------------------
       CREATE HTML
    --------------------------------------------- */


    let html = "";


    Object.keys(categories)
        .forEach(
            function(category) {


                html += `

                    <div class="category">

                        <h3>
                            ${escapeHTML(category)}
                        </h3>

                `;


                categories[category]
                    .forEach(
                        function(item) {


                            html += `

                                <div class="menu-item">

                                    <div>

                                        <div class="item-name">
                                            ${escapeHTML(item.product_name)}
                                        </div>

                                        <div class="item-category">

                                            ${
                                                item.available
                                                    ? "Available"
                                                    : "Sold Out"
                                            }

                                        </div>

                                    </div>


                                    <div>

                                        <button

                                            onclick="toggleMenuItem(
                                                ${item.id},
                                                ${item.available}
                                            )"

                                            class="${
                                                item.available
                                                    ? "success"
                                                    : "danger"
                                            }"

                                        >

                                            ${
                                                item.available
                                                    ? "🟢 Available"
                                                    : "🔴 Sold Out"
                                            }

                                        </button>

                                    </div>

                                </div>

                            `;


                        }
                    );


                html += `

                    </div>

                `;


            }
        );


    container.innerHTML =
        html;

}


/* =====================================================
   TOGGLE MENU ITEM
===================================================== */


async function toggleMenuItem(
    id,
    currentStatus
) {


    console.log(
        "Changing menu item:",
        id
    );


    const { error } =

        await supabaseClient

            .from("menu_items")

            .update({

                available:
                    !currentStatus,

                updated_at:
                    new Date().toISOString()

            })

            .eq(
                "id",
                id
            );


    if (error) {


        console.error(
            "Menu update error:",
            error
        );


        alert(
            "Could not update menu item."
        );


        return;
    }


    loadMenu();

}


/* =====================================================
   LOAD ORDERS
===================================================== */


async function loadOrders() {


    const container =
        document.getElementById(
            "ordersContainer"
        );


    container.innerHTML =
        `<div class="loading">
            Loading orders...
        </div>`;


    const { data, error } =

        await supabaseClient

            .from("orders")

            .select("*")

            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {


        console.error(
            "Orders loading error:",
            error
        );


        container.innerHTML =
            `<div class="error-message">
                Could not load orders.
            </div>`;


        return;
    }


    if (
        !data ||
        data.length === 0
    ) {


        container.innerHTML =

            `<div class="empty">

                No orders yet.

            </div>`;


        return;
    }


    let html = "";


    data.forEach(
        function(order) {


            const created =
                new Date(
                    order.created_at
                ).toLocaleString();


            html += `

                <div class="order ${
                    order.status === "New"
                        ? "new-order"
                        : ""
                }">


                    <!-- ORDER HEADER -->

                    <div class="order-header">


                        <div class="order-number">

                            #${escapeHTML(
                                order.order_number
                            )}

                        </div>


                        <div class="order-status">

                            ${escapeHTML(
                                order.status
                            )}

                        </div>


                    </div>


                    <!-- ORDER DETAILS -->

                    <div class="order-details">


<strong>Customer:</strong>
${escapeHTML(order.customer_name)}


<strong>Phone:</strong>
${escapeHTML(order.phone)}


<strong>Order Type:</strong>
${escapeHTML(order.order_type)}


${
    order.order_type === "Delivery"

        ? `<strong>Address:</strong>
${escapeHTML(
    order.delivery_address ||
    "N/A"
)}`

        : `<strong>Pickup Time:</strong>
${escapeHTML(
    order.pickup_time ||
    "Not specified"
)}`
}


<strong>Payment:</strong>
${escapeHTML(order.payment_method)}


${
    order.gcash_reference

        ? `<strong>GCash Reference:</strong>
${escapeHTML(
    order.gcash_reference
)}`

        : ""
}


<strong>Items:</strong>
${escapeHTML(
    order.ordered_items
)}


${
    order.order_notes

        ? `<strong>Notes:</strong>
${escapeHTML(
    order.order_notes
)}`

        : ""
}


<strong>Ordered:</strong>
${escapeHTML(created)}


                    </div>


                    <!-- TOTAL -->

                    <div class="order-total">

                        Total:
                        ₱${Number(
                            order.grand_total
                        ).toLocaleString(
                            "en-PH",
                            {
                                minimumFractionDigits: 2
                            }
                        )}

                    </div>


                    <!-- STATUS BUTTONS -->

                    <div class="status-buttons">


                        <button

                            class="status-button ${
                                order.status === "New"
                                    ? "selected"
                                    : ""
                            }"

                            onclick="updateOrderStatus(
                                ${order.id},
                                'New'
                            )"

                        >

                            🆕 New

                        </button>


                        <button

                            class="status-button ${
                                order.status === "Preparing"
                                    ? "selected"
                                    : ""
                            }"

                            onclick="updateOrderStatus(
                                ${order.id},
                                'Preparing'
                            )"

                        >

                            👨‍🍳 Preparing

                        </button>


                        <button

                            class="status-button ${
                                order.status === "Ready"
                                    ? "selected"
                                    : ""
                            }"

                            onclick="updateOrderStatus(
                                ${order.id},
                                'Ready'
                            )"

                        >

                            ✅ Ready

                        </button>


                        <button

                            class="status-button ${
                                order.status === "Completed"
                                    ? "selected"
                                    : ""
                            }"

                            onclick="updateOrderStatus(
                                ${order.id},
                                'Completed'
                            )"

                        >

                            ✔ Completed

                        </button>


                        <button

                            class="status-button ${
                                order.status === "Cancelled"
                                    ? "selected"
                                    : ""
                            }"

                            onclick="updateOrderStatus(
                                ${order.id},
                                'Cancelled'
                            )"

                        >

                            ❌ Cancelled

                        </button>


                    </div>


                </div>

            `;

        }
    );


    container.innerHTML =
        html;

}


/* =====================================================
   UPDATE ORDER STATUS
===================================================== */


async function updateOrderStatus(orderId, newStatus) {

    // ==========================================
    // DELETE ORDER WHEN COMPLETED
    // ==========================================

    if (newStatus === "Completed") {

        const confirmDelete = confirm(
            "Mark this order as COMPLETED and remove it from the dashboard?"
        );

        if (!confirmDelete) {
            return;
        }

        const { error } = await supabaseClient
            .from("orders")
            .delete()
            .eq("id", orderId);

        if (error) {
            console.error("Delete completed order error:", error);
            alert("Could not remove the completed order.");
            return;
        }

        // Refresh the dashboard
        loadOrders();

        return;
    }


    // ==========================================
    // NORMAL STATUS UPDATE
    // ==========================================

    const { error } = await supabaseClient
        .from("orders")
        .update({
            status: newStatus
        })
        .eq("id", orderId);

    if (error) {
        console.error("Order status update error:", error);
        alert("Could not update order status.");
        return;
    }

    // Refresh the dashboard
    loadOrders();
}

/* =====================================================
   HTML ESCAPE
===================================================== */


/*
    This prevents customer-entered information
    from being interpreted as HTML.
*/


function escapeHTML(
    value
) {


    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   INITIAL LOAD
===================================================== */


document.addEventListener(
    "DOMContentLoaded",
    function() {


        console.log(
            "Loading HIGHWAY CAFE admin dashboard..."
        );


        loadShopStatus();

        loadMenu();

        loadOrders();


    }
);


</script>


</body>

</html>
