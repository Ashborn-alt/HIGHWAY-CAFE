<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HIGHWAY CAFE - Admin</title>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            background: #f5eee6;

            font-family: Arial, sans-serif;

            color: #4b2e1f;
        }


        h1 {

            text-align: center;

            margin-bottom: 5px;

            font-size: 36px;
        }


        .subtitle {

            text-align: center;

            color: #6b5143;

            margin-bottom: 25px;
        }


        .container {

            max-width: 1100px;

            margin: auto;
        }


        .card {

            background: white;

            border-radius: 12px;

            padding: 20px;

            margin-bottom: 20px;

            box-shadow:
                0 3px 10px rgba(0,0,0,0.08);
        }


        .card h2 {

            margin-top: 0;

            border-bottom: 2px solid #eee;

            padding-bottom: 10px;
        }


        /* ==============================
           SHOP STATUS
        ============================== */

        .shop-status {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            flex-wrap: wrap;
        }


        .status {

            font-size: 24px;

            font-weight: bold;
        }


        .open {

            color: green;
        }


        .closed {

            color: red;
        }


        button {

            border: none;

            border-radius: 8px;

            padding: 10px 18px;

            font-size: 15px;

            cursor: pointer;

            background: #4b2e1f;

            color: white;
        }


        button:hover {

            opacity: 0.85;
        }


        .danger {

            background: #b22222;
        }


        .success {

            background: #228b22;
        }


        /* ==============================
           MENU
        ============================== */

        .category {

            margin-top: 25px;
        }


        .category h3 {

            margin-bottom: 10px;

            color: #6b5143;
        }


        .menu-item {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 12px;

            border-bottom: 1px solid #eee;

            gap: 15px;
        }


        .menu-item:last-child {

            border-bottom: none;
        }


        .item-name {

            font-weight: bold;
        }


        .item-category {

            font-size: 13px;

            color: #888;
        }


        .available {

            color: green;

            font-weight: bold;
        }


        .sold-out {

            color: red;

            font-weight: bold;
        }


        /* ==============================
           ORDERS
        ============================== */

        .order {

            border: 1px solid #ddd;

            border-radius: 10px;

            padding: 15px;

            margin-bottom: 15px;

            background: #fafafa;
        }


        .order-header {

            display: flex;

            justify-content: space-between;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 10px;
        }


        .order-number {

            font-size: 20px;

            font-weight: bold;
        }


        .new-order {

            border-left: 6px solid #228b22;
        }


        .order-details {

            line-height: 1.6;

            white-space: pre-wrap;

            margin-bottom: 15px;
        }


        .order-total {

            font-size: 20px;

            font-weight: bold;

            margin-top: 10px;
        }


        .status-buttons {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;

            margin-top: 15px;
        }


        .status-button {

            background: #777;
        }


        .status-button.selected {

            background: #4b2e1f;
        }


        .empty {

            text-align: center;

            padding: 25px;

            color: #777;
        }


        .refresh-button {

            margin-bottom: 15px;
        }


        /* ==============================
           MOBILE
        ============================== */

        @media (max-width: 600px) {

            body {

                padding: 10px;
            }


            h1 {

                font-size: 28px;
            }


            .shop-status {

                flex-direction: column;

                align-items: stretch;
            }


            .shop-status button {

                width: 100%;
            }


            .menu-item {

                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <h1>
        HIGHWAY CAFE
    </h1>


    <div class="subtitle">
        ADMIN DASHBOARD
    </div>


    <!-- =================================================
         SHOP STATUS
    ================================================== -->

    <div class="card">

        <h2>
            🏪 Shop Status
        </h2>


        <div class="shop-status">

            <div id="shopStatus"
                 class="status">

                Loading...

            </div>


            <button
                id="shopToggleButton"
                onclick="toggleShop()">

                Loading...

            </button>

        </div>

    </div>


    <!-- =================================================
         MENU AVAILABILITY
    ================================================== -->

    <div class="card">

        <h2>
            ☕ Menu Availability
        </h2>


        <div id="menuContainer">

            Loading menu...

        </div>

    </div>


    <!-- =================================================
         ORDERS
    ================================================== -->

    <div class="card">

        <h2>
            📦 Orders
        </h2>


        <button
            class="refresh-button"
            onclick="loadOrders()">

            🔄 Refresh Orders

        </button>


        <div id="ordersContainer">

            Loading orders...

        </div>

    </div>


</div>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */


/*
    IMPORTANT:

    Replace these two values with the
    Project URL and Publishable Key
    from your Supabase project.
*/


const SUPABASE_URL =
    "https://qfnjegsbyxxqsdaelqqa.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_ttu1AyOaylp3J4x7iTqaNg_1VLOdHoE";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   SHOP STATUS
===================================================== */

async function loadShopStatus() {

    const { data, error } =
        await supabaseClient
            .from("shop_settings")
            .select("*")
            .limit(1)
            .single();


    if (error) {

        console.error(error);

        document.getElementById(
            "shopStatus"
        ).textContent =
            "Error loading shop status.";

        return;
    }


    updateShopDisplay(
        data.shop_open
    );
}


/* =====================================================
   DISPLAY SHOP STATUS
===================================================== */

function updateShopDisplay(
    isOpen
) {

    const status =
        document.getElementById(
            "shopStatus"
        );


    const button =
        document.getElementById(
            "shopToggleButton"
        );


    if (isOpen) {

        status.textContent =
            "🟢 SHOP IS OPEN";

        status.className =
            "status open";


        button.textContent =
            "🔴 Close Shop";

        button.className =
            "danger";
    }


    else {

        status.textContent =
            "🔴 SHOP IS CLOSED";

        status.className =
            "status closed";


        button.textContent =
            "🟢 Open Shop";

        button.className =
            "success";
    }
}


/* =====================================================
   TOGGLE SHOP
===================================================== */

async function toggleShop() {

    /* ---------------------------------------------
       GET CURRENT SHOP STATUS
    --------------------------------------------- */

    const { data, error } =
        await supabaseClient
            .from("shop_settings")
            .select("shop_open")
            .limit(1);


    if (error) {

        console.error(
            "Could not read shop status:",
            error
        );

        alert(
            "Could not read shop status."
        );

        return;
    }


    if (!data || data.length === 0) {

        console.error(
            "No shop settings row found."
        );

        alert(
            "No shop settings were found."
        );

        return;
    }


    /* ---------------------------------------------
       GET CURRENT VALUE
    --------------------------------------------- */

    const currentStatus =
        data[0].shop_open;


    const newStatus =
        !currentStatus;


    /* ---------------------------------------------
       UPDATE SHOP STATUS
    --------------------------------------------- */

    const { error: updateError } =
        await supabaseClient
            .from("shop_settings")
            .update({
                shop_open: newStatus,

                updated_at:
                    new Date().toISOString()
            })
            .eq(
                "shop_open",
                currentStatus
            );


    if (updateError) {

        console.error(
            "Shop update error:",
            updateError
        );

        alert(
            "Could not update shop status."
        );

        return;
    }


    /* ---------------------------------------------
       UPDATE DISPLAY
    --------------------------------------------- */

    updateShopDisplay(
        newStatus
    );
}


/* =====================================================
   LOAD MENU
===================================================== */

async function loadMenu() {

    const container =
        document.getElementById(
            "menuContainer"
        );


    const { data, error } =
        await supabaseClient
            .from("menu_items")
            .select("*")
            .order("category")
            .order("product_name");


    if (error) {

        console.error(error);

        container.innerHTML =
            "<p>Could not load menu.</p>";

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            "<p>No menu items found.</p>";

        return;
    }


    const categories = {};


    data.forEach(function(item) {

        if (!categories[item.category]) {

            categories[item.category] = [];
        }


        categories[item.category].push(
            item
        );
    });


    let html = "";


    Object.keys(categories)
        .forEach(function(category) {

            html += `

                <div class="category">

                    <h3>
                        ${category}
                    </h3>

            `;


            categories[category]
                .forEach(function(item) {

                    html += `

                        <div class="menu-item">

                            <div>

                                <div class="item-name">
                                    ${item.product_name}
                                </div>

                                <div class="item-category">
                                    ${item.available
                                        ? "Available"
                                        : "Sold Out"}
                                </div>

                            </div>


                            <div>

                                <button
                                    onclick="toggleMenuItem(
                                        ${item.id},
                                        ${item.available}
                                    )"
                                    class="${
                                        item.available
                                            ? "success"
                                            : "danger"
                                    }">

                                    ${
                                        item.available
                                            ? "🟢 Available"
                                            : "🔴 Sold Out"
                                    }

                                </button>

                            </div>

                        </div>

                    `;

                });


            html += `
                </div>
            `;

        });


    container.innerHTML =
        html;
}


/* =====================================================
   TOGGLE MENU ITEM
===================================================== */

async function toggleMenuItem(
    id,
    currentStatus
) {

    const { error } =
        await supabaseClient
            .from("menu_items")
            .update({
                available:
                    !currentStatus,

                updated_at:
                    new Date().toISOString()
            })
            .eq("id", id);


    if (error) {

        alert(
            "Could not update menu item."
        );

        console.error(error);

        return;
    }


    loadMenu();
}


/* =====================================================
   LOAD ORDERS
===================================================== */

async function loadOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    container.innerHTML =
        "Loading orders...";


    const { data, error } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        container.innerHTML =
            "<p>Could not load orders.</p>";

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            `
                <div class="empty">
                    No orders yet.
                </div>
            `;

        return;
    }


    let html = "";


    data.forEach(function(order) {

        const created =
            new Date(
                order.created_at
            ).toLocaleString();


        html += `

            <div class="order ${
                order.status === "New"
                    ? "new-order"
                    : ""
            }">


                <div class="order-header">

                    <div class="order-number">

                        #${order.order_number}

                    </div>


                    <strong>

                        ${order.status}

                    </strong>

                </div>


                <div class="order-details">

<strong>Customer:</strong>
${order.customer_name}

<strong>Phone:</strong>
${order.phone}

<strong>Order Type:</strong>
${order.order_type}

${
    order.order_type === "Delivery"
        ? `<strong>Address:</strong>
${order.delivery_address || "N/A"}`
        : `<strong>Pickup Time:</strong>
${order.pickup_time || "Not specified"}`
}

<strong>Payment:</strong>
${order.payment_method}

${
    order.gcash_reference
        ? `<strong>GCash Reference:</strong>
${order.gcash_reference}`
        : ""
}

<strong>Items:</strong>
${order.ordered_items}

${
    order.order_notes
        ? `<strong>Notes:</strong>
${order.order_notes}`
        : ""
}

<strong>Ordered:</strong>
${created}

                </div>


                <div class="order-total">

                    Total:
                    ₱${Number(
                        order.grand_total
                    ).toLocaleString(
                        "en-PH",
                        {
                            minimumFractionDigits: 2
                        }
                    )}

                </div>


                <div class="status-buttons">

                    <button
                        class="status-button ${
                            order.status === "New"
                                ? "selected"
                                : ""
                        }"
                        onclick="updateOrderStatus(
                            ${order.id},
                            'New'
                        )">

                        🆕 New

                    </button>


                    <button
                        class="status-button ${
                            order.status === "Preparing"
                                ? "selected"
                                : ""
                        }"
                        onclick="updateOrderStatus(
                            ${order.id},
                            'Preparing'
                        )">

                        👨‍🍳 Preparing

                    </button>


                    <button
                        class="status-button ${
                            order.status === "Ready"
                                ? "selected"
                                : ""
                        }"
                        onclick="updateOrderStatus(
                            ${order.id},
                            'Ready'
                        )">

                        ✅ Ready

                    </button>


                    <button
                        class="status-button ${
                            order.status === "Completed"
                                ? "selected"
                                : ""
                        }"
                        onclick="updateOrderStatus(
                            ${order.id},
                            'Completed'
                        )">

                        ✔ Completed

                    </button>


                    <button
                        class="status-button ${
                            order.status === "Cancelled"
                                ? "selected"
                                : ""
                        }"
                        onclick="updateOrderStatus(
                            ${order.id},
                            'Cancelled'
                        )">

                        ❌ Cancelled

                    </button>

                </div>

            </div>

        `;

    });


    container.innerHTML =
        html;
}


/* =====================================================
   UPDATE ORDER STATUS
===================================================== */

async function updateOrderStatus(
    id,
    status
) {

    const { error } =
        await supabaseClient
            .from("orders")
            .update({
                status: status
            })
            .eq("id", id);


    if (error) {

        alert(
            "Could not update order."
        );

        console.error(error);

        return;
    }


    loadOrders();
}


/* =====================================================
   INITIAL LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadShopStatus();

        loadMenu();

        loadOrders();

    }
);

</script>


</body>

</html>
