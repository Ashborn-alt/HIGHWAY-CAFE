<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HIGHWAY CAFE ADMIN</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5eee6;
            color: #3e2723;
        }

        h1,
        h2,
        h3 {
            color: #4b2e1f;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }


        /* =====================================================
           LOGIN
        ===================================================== */

        #loginScreen {

            max-width: 420px;

            margin: 80px auto;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        #loginScreen h1 {
            margin-bottom: 5px;
        }

        #loginScreen p {
            color: #777;
            margin-bottom: 25px;
        }

        .login-input {

            width: 100%;

            padding: 13px;

            margin-bottom: 15px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;
        }

        #loginButton {

            width: 100%;

            background: #4b2e1f;

            color: white;

            font-size: 16px;
        }

        #loginButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #loginError {

            color: #c62828;

            margin-top: 15px;

            display: none;
        }


        /* =====================================================
           ADMIN DASHBOARD
        ===================================================== */

        #adminDashboard {
            display: none;
            max-width: 1200px;
            margin: auto;
        }

        .admin-header {

            background: white;

            padding: 20px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 20px;

            flex-wrap: wrap;
        }

        .admin-header h1 {
            margin: 0;
        }

        #loggedInEmail {
            font-size: 14px;
            color: #777;
            margin-top: 5px;
        }

        #logoutButton {

            background: #8b4513;

            color: white;
        }


        /* =====================================================
           SHOP STATUS
        ===================================================== */

        .admin-card {

            background: white;

            padding: 20px;

            border-radius: 15px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);

            margin-bottom: 20px;
        }

        #shopStatus {

            font-size: 24px;

            font-weight: bold;

            margin: 10px 0 15px;
        }

        #shopToggleButton {

            color: white;

            font-size: 15px;
        }


        /* =====================================================
           MENU
        ===================================================== */

        .menu-category {

            margin-bottom: 25px;
        }

        .menu-category h3 {

            border-bottom: 2px solid #ddd;

            padding-bottom: 8px;
        }

        .menu-item {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            padding: 12px;

            border-bottom: 1px solid #eee;

            flex-wrap: wrap;
        }

        .menu-item-name {
            font-weight: bold;
        }

        .availability-button {

            color: white;

            min-width: 120px;
        }


        /* =====================================================
           ORDERS
        ===================================================== */

        #ordersContainer {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-card {

            border: 1px solid #ddd;

            border-radius: 12px;

            padding: 18px;

            background: #fff;
        }

        .order-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            flex-wrap: wrap;

            margin-bottom: 10px;
        }

        .order-number {

            font-size: 20px;

            font-weight: bold;

            color: #4b2e1f;
        }

        .order-status {

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 13px;

            font-weight: bold;

            background: #eee;
        }

        .order-info {

            line-height: 1.6;

            margin-bottom: 12px;
        }

        .order-items {

            background: #f8f5f1;

            padding: 12px;

            border-radius: 8px;

            white-space: pre-line;

            margin-bottom: 12px;
        }

        .order-total {

            font-size: 18px;

            font-weight: bold;

            margin-bottom: 15px;
        }

        .status-buttons {

            display: flex;

            gap: 8px;

            flex-wrap: wrap;
        }

        .status-buttons button {
            color: white;
        }

        .status-new {
            background: #2196f3;
        }

        .status-preparing {
            background: #ff9800;
        }

        .status-ready {
            background: #4caf50;
        }

        .status-completed {
            background: #2e7d32;
        }

        .status-cancelled {
            background: #c62828;
        }

        .refresh-button {

            background: #4b2e1f;

            color: white;

            margin-bottom: 15px;
        }

        .empty-orders {

            text-align: center;

            padding: 30px;

            color: #777;
        }

        .loading {

            text-align: center;

            padding: 20px;

            color: #777;
        }

        .error-message {

            color: #c62828;

            padding: 15px;

            background: #ffebee;

            border-radius: 8px;

            margin-top: 10px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            #loginScreen {
                margin: 40px auto;
                padding: 20px;
            }

            .admin-header {
                align-items: flex-start;
            }

            .menu-item {
                align-items: flex-start;
            }

            .availability-button {
                width: 100%;
            }

            .status-buttons button {
                flex: 1;
                min-width: 100px;
            }
        }

    </style>

</head>


<body>


    <!-- =====================================================
         LOGIN SCREEN
    ===================================================== -->

    <div id="loginScreen">

        <h1>☕ HIGHWAY CAFE</h1>

        <h2>Admin Login</h2>

        <p>Sign in to access the admin dashboard.</p>


        <form id="loginForm">

            <input
                type="email"
                id="loginEmail"
                class="login-input"
                placeholder="Admin email"
                autocomplete="email"
                required
            >

            <input
                type="password"
                id="loginPassword"
                class="login-input"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                id="loginButton"
            >
                LOGIN
            </button>

        </form>


        <div id="loginError"></div>

    </div>



    <!-- =====================================================
         ADMIN DASHBOARD
    ===================================================== -->

    <div id="adminDashboard">


        <!-- HEADER -->

        <div class="admin-header">

            <div>

                <h1>☕ HIGHWAY CAFE ADMIN</h1>

                <div id="loggedInEmail"></div>

            </div>

            <button
                id="logoutButton"
                onclick="logoutAdmin()"
            >
                LOG OUT
            </button>

        </div>



        <!-- =================================================
             SHOP STATUS
        ================================================= -->

        <div class="admin-card">

            <h2>🏪 Shop Status</h2>

            <div id="shopStatus">
                Loading...
            </div>

            <button
                id="shopToggleButton"
                onclick="toggleShop()"
            >
                Loading...
            </button>

        </div>



        <!-- =================================================
             MENU AVAILABILITY
        ================================================= -->

        <div class="admin-card">

            <h2>🍔 Menu Availability</h2>

            <p>
                Turn individual products on or off when they are
                unavailable.
            </p>

            <div id="menuContainer">

                <div class="loading">
                    Loading menu...
                </div>

            </div>

        </div>



        <!-- =================================================
             ORDERS
        ================================================= -->

        <div class="admin-card">

            <h2>📋 Customer Orders</h2>

            <button
                class="refresh-button"
                onclick="loadOrders()"
            >
                🔄 Refresh Orders
            </button>

            <div id="ordersContainer">

                <div class="loading">
                    Loading orders...
                </div>

            </div>

        </div>


    </div>



<script>


// =====================================================
// SUPABASE
// =====================================================

const SUPABASE_URL =
    "https://qfnjegsbyxxqsdaelqqa.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_ttu1AyOaylp3J4x7iTqaNg_1VLOdHoE";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// =====================================================
// LOGIN
// =====================================================

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document
                .getElementById("loginEmail")
                .value
                .trim();

        const password =
            document
                .getElementById("loginPassword")
                .value;

        const loginButton =
            document.getElementById("loginButton");

        const loginError =
            document.getElementById("loginError");


        loginError.style.display = "none";

        loginButton.disabled = true;

        loginButton.textContent = "LOGGING IN...";


        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });


        if (error) {

            console.error("Login error:", error);

            loginError.textContent =
                "Login failed: " + error.message;

            loginError.style.display = "block";

            loginButton.disabled = false;

            loginButton.textContent = "LOGIN";

            return;
        }


        console.log("Admin login successful:", data.user.email);

        showAdminDashboard(data.user);

    });



// =====================================================
// CHECK LOGIN SESSION
// =====================================================

async function checkAdminSession() {

    const {
        data: {
            session
        }
    } =
        await supabaseClient.auth.getSession();


    if (session && session.user) {

        showAdminDashboard(session.user);

    } else {

        showLoginScreen();

    }

}



// =====================================================
// SHOW LOGIN
// =====================================================

function showLoginScreen() {

    document
        .getElementById("loginScreen")
        .style.display = "block";

    document
        .getElementById("adminDashboard")
        .style.display = "none";

}



// =====================================================
// SHOW DASHBOARD
// =====================================================

function showAdminDashboard(user) {

    document
        .getElementById("loginScreen")
        .style.display = "none";

    document
        .getElementById("adminDashboard")
        .style.display = "block";


    document
        .getElementById("loggedInEmail")
        .textContent =
            "Logged in as: " + user.email;


    loadShopStatus();

    loadMenu();

    loadOrders();

}



// =====================================================
// LOGOUT
// =====================================================

async function logoutAdmin() {

    const confirmed =
        confirm("Are you sure you want to log out?");


    if (!confirmed) {
        return;
    }


    const { error } =
        await supabaseClient.auth.signOut();


    if (error) {

        console.error("Logout error:", error);

        alert("Could not log out.");

        return;
    }


    showLoginScreen();


    document
        .getElementById("loginEmail")
        .value = "";

    document
        .getElementById("loginPassword")
        .value = "";

}



// =====================================================
// SHOP STATUS
// =====================================================

async function loadShopStatus() {

    const { data, error } =
        await supabaseClient
            .from("shop_settings")
            .select("shop_open")
            .limit(1);


    if (error) {

        console.error(
            "Shop status loading error:",
            error
        );

        document
            .getElementById("shopStatus")
            .textContent =
                "Error loading shop status";

        return;
    }


    if (!data || data.length === 0) {

        document
            .getElementById("shopStatus")
            .textContent =
                "No shop settings found";

        return;
    }


    updateShopDisplay(data[0].shop_open);

}



// =====================================================
// UPDATE SHOP DISPLAY
// =====================================================

function updateShopDisplay(isOpen) {

    const status =
        document.getElementById("shopStatus");

    const button =
        document.getElementById("shopToggleButton");


    if (isOpen) {

        status.textContent =
            "🟢 SHOP IS OPEN";

        status.style.color =
            "#2e7d32";

        button.textContent =
            "🔴 CLOSE SHOP";

        button.style.background =
            "#c62828";

    } else {

        status.textContent =
            "🔴 SHOP IS CLOSED";

        status.style.color =
            "#c62828";

        button.textContent =
            "🟢 OPEN SHOP";

        button.style.background =
            "#2e7d32";

    }

}



// =====================================================
// TOGGLE SHOP
// =====================================================

async function toggleShop() {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("shop_settings")
            .select("shop_open")
            .limit(1);


    if (error) {

        console.error(
            "Could not read shop status:",
            error
        );

        alert("Could not read shop status.");

        return;
    }


    if (!data || data.length === 0) {

        alert("No shop settings were found.");

        return;
    }


    const currentStatus =
        data[0].shop_open;

    const newStatus =
        !currentStatus;


    const {
        error: updateError
    } =
        await supabaseClient
            .from("shop_settings")
            .update({
                shop_open: newStatus,
                updated_at:
                    new Date().toISOString()
            })
            .eq(
                "shop_open",
                currentStatus
            );


    if (updateError) {

        console.error(
            "Shop update error:",
            updateError
        );

        alert(
            "Could not update shop status."
        );

        return;
    }


    updateShopDisplay(newStatus);

}



// =====================================================
// LOAD MENU
// =====================================================

async function loadMenu() {

    const container =
        document.getElementById(
            "menuContainer"
        );


    container.innerHTML =
        '<div class="loading">Loading menu...</div>';


    const {
        data,
        error
    } =
        await supabaseClient
            .from("menu_items")
            .select("*")
            .order("category")
            .order("product_name");


    if (error) {

        console.error(
            "Menu loading error:",
            error
        );

        container.innerHTML =
            '<div class="error-message">Could not load menu.</div>';

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="empty-orders">No menu items found.</div>';

        return;
    }


    const categories = {};


    data.forEach(function(item) {

        if (!categories[item.category]) {

            categories[item.category] = [];

        }

        categories[item.category].push(item);

    });


    container.innerHTML = "";


    Object.keys(categories).forEach(function(category) {

        const categoryDiv =
            document.createElement("div");

        categoryDiv.className =
            "menu-category";


        const title =
            document.createElement("h3");

        title.textContent =
            category;


        categoryDiv.appendChild(title);


        categories[category].forEach(function(item) {

            const row =
                document.createElement("div");

            row.className =
                "menu-item";


            const name =
                document.createElement("div");

            name.className =
                "menu-item-name";

            name.textContent =
                item.product_name;


            const button =
                document.createElement("button");

            button.className =
                "availability-button";


            if (item.available) {

                button.textContent =
                    "🟢 AVAILABLE";

                button.style.background =
                    "#2e7d32";

            } else {

                button.textContent =
                    "🔴 SOLD OUT";

                button.style.background =
                    "#c62828";

            }


            button.onclick =
                function() {

                    toggleMenuItem(
                        item.id,
                        item.available
                    );

                };


            row.appendChild(name);

            row.appendChild(button);

            categoryDiv.appendChild(row);

        });


        container.appendChild(categoryDiv);

    });

}



// =====================================================
// TOGGLE MENU ITEM
// =====================================================

async function toggleMenuItem(
    id,
    currentAvailability
) {

    const newAvailability =
        !currentAvailability;


    const {
        error
    } =
        await supabaseClient
            .from("menu_items")
            .update({
                available:
                    newAvailability,

                updated_at:
                    new Date().toISOString()
            })
            .eq("id", id);


    if (error) {

        console.error(
            "Menu update error:",
            error
        );

        alert(
            "Could not update menu availability."
        );

        return;
    }


    loadMenu();

}



// =====================================================
// LOAD ORDERS
// =====================================================

async function loadOrders() {

    const container =
        document.getElementById(
            "ordersContainer"
        );


    container.innerHTML =
        '<div class="loading">Loading orders...</div>';


    const {
        data,
        error
    } =
        await supabaseClient
            .from("orders")
            .select("*")
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Orders loading error:",
            error
        );

        container.innerHTML =
            '<div class="error-message">Could not load orders.</div>';

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML =
            '<div class="empty-orders">No active orders.</div>';

        return;
    }


    container.innerHTML = "";


    data.forEach(function(order) {

        const card =
            document.createElement("div");

        card.className =
            "order-card";


        // ---------------------------------------------
        // TOP
        // ---------------------------------------------

        const top =
            document.createElement("div");

        top.className =
            "order-top";


        const orderNumber =
            document.createElement("div");

        orderNumber.className =
            "order-number";

        orderNumber.textContent =
            order.order_number;


        const status =
            document.createElement("div");

        status.className =
            "order-status";

        status.textContent =
            order.status;


        top.appendChild(orderNumber);

        top.appendChild(status);


        // ---------------------------------------------
        // CUSTOMER INFORMATION
        // ---------------------------------------------

        const info =
            document.createElement("div");

        info.className =
            "order-info";


        let infoHTML = "";

        infoHTML +=
            "<strong>Customer:</strong> "
            + escapeHTML(order.customer_name)
            + "<br>";

        infoHTML +=
            "<strong>Phone:</strong> "
            + escapeHTML(order.phone)
            + "<br>";

        infoHTML +=
            "<strong>Order Type:</strong> "
            + escapeHTML(order.order_type)
            + "<br>";


        if (order.delivery_address) {

            infoHTML +=
                "<strong>Delivery Address:</strong> "
                + escapeHTML(
                    order.delivery_address
                )
                + "<br>";

        }


        if (order.pickup_time) {

            infoHTML +=
                "<strong>Pickup Time:</strong> "
                + escapeHTML(
                    order.pickup_time
                )
                + "<br>";

        }


        infoHTML +=
            "<strong>Payment:</strong> "
            + escapeHTML(
                order.payment_method
            )
            + "<br>";


        if (order.gcash_reference) {

            infoHTML +=
                "<strong>GCash Reference:</strong> "
                + escapeHTML(
                    order.gcash_reference
                )
                + "<br>";

        }


        if (order.order_notes) {

            infoHTML +=
                "<strong>Notes:</strong> "
                + escapeHTML(
                    order.order_notes
                )
                + "<br>";

        }


        infoHTML +=
            "<strong>Time:</strong> "
            + new Date(
                order.created_at
            ).toLocaleString();


        info.innerHTML =
            infoHTML;


        // ---------------------------------------------
        // ITEMS
        // ---------------------------------------------

        const items =
            document.createElement("div");

        items.className =
            "order-items";

        items.textContent =
            order.ordered_items || "";


        // ---------------------------------------------
        // TOTAL
        // ---------------------------------------------

        const total =
            document.createElement("div");

        total.className =
            "order-total";

        total.textContent =
            "Total: ₱"
            + Number(
                order.grand_total || 0
            ).toFixed(2);


        // ---------------------------------------------
        // STATUS BUTTONS
        // ---------------------------------------------

        const statusButtons =
            document.createElement("div");

        statusButtons.className =
            "status-buttons";


        const statuses = [
            {
                name: "New",
                className: "status-new"
            },
            {
                name: "Preparing",
                className: "status-preparing"
            },
            {
                name: "Ready",
                className: "status-ready"
            },
            {
                name: "Completed",
                className: "status-completed"
            },
            {
                name: "Cancelled",
                className: "status-cancelled"
            }
        ];


        statuses.forEach(function(statusOption) {

            const button =
                document.createElement("button");

            button.textContent =
                statusOption.name;

            button.className =
                statusOption.className;


            button.onclick =
                function() {

                    updateOrderStatus(
                        order.id,
                        statusOption.name
                    );

                };


            statusButtons.appendChild(button);

        });


        // ---------------------------------------------
        // BUILD CARD
        // ---------------------------------------------

        card.appendChild(top);

        card.appendChild(info);

        card.appendChild(items);

        card.appendChild(total);

        card.appendChild(statusButtons);


        container.appendChild(card);

    });

}



// =====================================================
// UPDATE ORDER STATUS
// =====================================================

async function updateOrderStatus(
    orderId,
    newStatus
) {


    // ================================================
    // COMPLETED = DELETE
    // ================================================

    if (newStatus === "Completed") {

        const confirmed =
            confirm(
                "Mark this order as COMPLETED and remove it from the dashboard?"
            );


        if (!confirmed) {
            return;
        }


        const {
            error
        } =
            await supabaseClient
                .from("orders")
                .delete()
                .eq("id", orderId);


        if (error) {

            console.error(
                "Delete completed order error:",
                error
            );

            alert(
                "Could not remove the completed order."
            );

            return;
        }


        loadOrders();

        return;
    }



    // ================================================
    // NORMAL STATUS UPDATE
    // ================================================

    const {
        error
    } =
        await supabaseClient
            .from("orders")
            .update({
                status: newStatus
            })
            .eq("id", orderId);


    if (error) {

        console.error(
            "Order status update error:",
            error
        );

        alert(
            "Could not update order status."
        );

        return;
    }


    loadOrders();

}



// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}



// =====================================================
// AUTH STATE
// =====================================================

supabaseClient.auth.onAuthStateChange(
    function(event, session) {

        if (session && session.user) {

            showAdminDashboard(
                session.user
            );

        } else {

            showLoginScreen();

        }

    }
);



// =====================================================
// START
// =====================================================

checkAdminSession();

</script>


</body>

</html>
